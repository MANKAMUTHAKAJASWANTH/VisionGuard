spring.application.name=VisionGuard Security API
spring.datasource.url=jdbc:h2:mem:visionguarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
server.port=8080

# Supabase Configurations
# Project: cysnwrzwhvakehfeniqj
supabase.url=https://cysnwrzwhvakehfeniqj.supabase.co
# Publishable key used for PostgREST REST API (sb_secret_ is blocked from REST by new Supabase)
supabase.service-role-key=sb_publishable_HK2iI_efVaREutKh7HBZHw_mAzV7Wfx
# Secret key (for future Supabase Management API / JWT verification use only)
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=https://cysnwrzwhvakehfeniqj.supabase.co/auth/v1/.well-known/jwks.json

# --- Performance Optimizations ---
# Enable GZIP response compression for faster frontend data transfer
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Tomcat thread pool tuning for low-latency concurrent requests
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=5000

# Jackson JSON serialization - exclude null fields for smaller payloads
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false
